name: Build Kernel TongYi

on:
  push:
    paths:
      - ".github/workflows/main.yml"
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04

    steps:
      - name: Checkout This Repo
        uses: actions/checkout@v4

      - name: Install Base Dependencies
        run: |
          apt update
          apt install -y git build-essential libncurses-dev flex bison libssl-dev wget gnupg software-properties-common

      - name: Add LLVM Repository for Clang-16
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | apt-key add -
          add-apt-repository -y "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-16 main"
          apt update

      - name: Install Clang-16 and Tools
        run: |
          apt install -y clang-16 lld-16 lldb-16

      - name: Set CC to Clang-16 in PATH
        run: |
          echo "PATH=/usr/lib/llvm-16/bin:$PATH" >> $GITHUB_ENV

      - name: Clone Kernel Source
        run: |
          git clone https://github.com/burkvt/android_kernel_xiaomi_jason_15 kernel

      - name: Fix fixdep with GCC
        working-directory: kernel/scripts/basic/
        run: |
          make clean
          make CC=gcc fixdep

      - name: Configure Kernel with VDSO Disabled
        working-directory: kernel
        run: |
          make O=out ARCH=arm64 jason_defconfig
          echo "CONFIG_ARM64_VDSO=n" >> out/.config
          make O=out olddefconfig

      - name: Build Kernel
        working-directory: kernel
        run: |
          make O=out ARCH=arm64 CC=clang-16 -j$(nproc)

      - name: Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
